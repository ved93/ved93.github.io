<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <!-- <button id="theme-toggle">Toggle Dark Theme</button> -->
    <!-- <button id="theme-toggle" style="position: absolute; top: 10px; right: 10px;">Toggle Dark Theme</button> -->

    <div id="theme-toggle-container">
      <!-- <input type="checkbox" id="theme-toggle">
      <label for="theme-toggle" id="theme-toggle-label">Toggle Dark Theme</label> -->
      <input class="theme-toggle-checkbox" id="theme-toggle" name="theme-toggle-checkbox" type="checkbox"/>
      <label class="theme-toggle-label" for="theme-toggle"></label>

    </div>


    <script>
      document.addEventListener('DOMContentLoaded', (event) => {
        const toggleButton = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme === 'dark') {
          document.body.classList.add('dark-theme');
        }

        toggleButton.addEventListener('click', () => {
          document.body.classList.toggle('dark-theme');

          let theme = 'light';
          if (document.body.classList.contains('dark-theme')) {
            theme = 'dark';
          }

          localStorage.setItem('theme', theme);
        });
      });
    </script>

  </body>

</html>
